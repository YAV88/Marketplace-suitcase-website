<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVALKA - Патруль модерации</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 500: '#14b8a6', 600: '#0d9488' } } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        h1, h2 { font-family: 'Montserrat', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #d6d3d1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #44403c; }
    </style>
</head>
<body class="p-4 sm:p-8 text-stone-800 dark:text-stone-200 bg-[#f5f5f4] dark:bg-[#1c1917] transition-colors min-h-screen">

    <div class="max-w-5xl mx-auto">
        
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4 mb-8">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-shield-halved text-red-600 text-3xl sm:text-4xl drop-shadow-sm"></i>
                <h1 class="text-3xl sm:text-4xl font-black uppercase tracking-tighter text-stone-900 dark:text-white">Svalka <span class="text-red-600">Admin</span></h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="toggleAdminTheme()" class="bg-white dark:bg-stone-800 text-stone-500 dark:text-stone-400 hover:text-brand-600 dark:hover:text-brand-400 font-bold transition w-10 h-10 rounded-xl border border-stone-200 dark:border-stone-700 shadow-sm flex items-center justify-center"><i id="theme-icon" class="fa-solid fa-moon"></i></button>
                <a href="index.html" class="text-stone-500 dark:text-stone-400 hover:text-stone-800 dark:hover:text-white font-bold transition flex items-center gap-2 bg-white dark:bg-stone-800 px-4 py-2.5 rounded-xl border border-stone-200 dark:border-stone-700 shadow-sm"><i class="fa-solid fa-arrow-left"></i> На сайт</a>
            </div>
        </div>
        
        <div class="bg-white dark:bg-stone-900 p-2 sm:p-6 rounded-[2rem] shadow-sm border border-stone-200 dark:border-stone-800 min-h-[500px] flex flex-col transition-colors">
            
            <div class="flex flex-col lg:flex-row justify-between gap-4 mb-6 p-2 sm:p-0">
                <div class="flex bg-stone-100 dark:bg-stone-800 p-1 rounded-xl w-full lg:w-max shrink-0 overflow-x-auto custom-scrollbar border border-stone-200 dark:border-stone-700">
                    <button onclick="switchTab('items')" id="tab-items" class="flex-1 lg:flex-none px-5 py-2.5 rounded-lg bg-white dark:bg-stone-700 shadow-sm font-bold text-sm text-stone-900 dark:text-white transition flex items-center justify-center gap-2 shrink-0">
                        <i class="fa-solid fa-box-open text-brand-500"></i> Товары <span id="count-items" class="bg-stone-200 dark:bg-stone-600 px-2 py-0.5 rounded-md text-[10px]">0</span>
                    </button>
                    <button onclick="switchTab('users')" id="tab-users" class="flex-1 lg:flex-none px-5 py-2.5 rounded-lg text-stone-500 dark:text-stone-400 font-bold text-sm hover:text-stone-900 dark:hover:text-white transition flex items-center justify-center gap-2 shrink-0">
                        <i class="fa-solid fa-users text-indigo-500"></i> Юзеры <span id="count-users" class="bg-stone-200 dark:bg-stone-800 px-2 py-0.5 rounded-md text-[10px]">0</span>
                    </button>
                    <button onclick="switchTab('reports')" id="tab-reports" class="flex-1 lg:flex-none px-5 py-2.5 rounded-lg text-stone-500 dark:text-stone-400 font-bold text-sm hover:text-stone-900 dark:hover:text-white transition flex items-center justify-center gap-2 shrink-0">
                        <i class="fa-solid fa-dumpster-fire text-red-500"></i> Жалобы <span id="count-reports" class="bg-stone-200 dark:bg-stone-800 px-2 py-0.5 rounded-md text-[10px]">0</span>
                    </button>
                    <button onclick="switchTab('pro_requests')" id="tab-pro" class="flex-1 lg:flex-none px-5 py-2.5 rounded-lg text-stone-500 dark:text-stone-400 font-bold text-sm hover:text-stone-900 dark:hover:text-white transition flex items-center justify-center gap-2 shrink-0">
                        <i class="fa-solid fa-crown text-amber-500"></i> PRO-заявки <span id="count-pro" class="bg-stone-200 dark:bg-stone-800 px-2 py-0.5 rounded-md text-[10px]">0</span>
                    </button>
                </div>
                
                <div class="flex gap-2 w-full lg:w-auto">
                    <!-- СЕНЬОР-ФИКС: Кнопка массовой рассылки (показывается только на вкладке пользователей) -->
                    <button id="admin-broadcast-btn" onclick="adminBroadcastMessage()" class="hidden bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-3 rounded-xl font-bold text-sm transition items-center justify-center gap-2 shadow-sm shrink-0 whitespace-nowrap">
                        <i class="fa-solid fa-bullhorn"></i> Рассылка
                    </button>

                    <select id="admin-category-filter" onchange="renderList()" class="bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-xl px-4 py-3 text-sm font-medium outline-none focus:border-brand-500 text-stone-900 dark:text-white transition cursor-pointer max-w-[150px]">
                        <option value="">Все категории</option>
                        <option value="Одежда">Одежда</option> <option value="Электроника">Электроника</option> <option value="Интерьер">Интерьер</option>
                        <option value="Транспорт">Транспорт</option> <option value="Услуги">Услуги</option> <option value="Жилье">Жилье</option>
                        <option value="Работа">Работа</option> <option value="Бизнес">Бизнес</option> <option value="Детям">Детям</option>
                    </select>

                    <div class="relative flex-1 lg:w-64 shrink-0">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-stone-400"></i>
                        <input type="text" id="admin-search" oninput="handleAdminSearch()" placeholder="Поиск товаров..." class="w-full bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-xl pl-11 pr-4 py-3 text-sm font-medium outline-none focus:border-brand-500 text-stone-900 dark:text-white transition shadow-inner">
                    </div>
                </div>
            </div>
            
            <div id="admin-list" class="space-y-3 flex-1 overflow-y-auto custom-scrollbar pr-2 pb-4">
                <div class="text-center py-20"><i class="fa-solid fa-circle-notch fa-spin text-4xl text-stone-300 dark:text-stone-600"></i></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ИНИЦИАЛИЗАЦИЯ ТЕМЫ
        function initTheme() {
            const savedTheme = localStorage.getItem('admin_theme');
            if(savedTheme === 'dark') document.documentElement.classList.add('dark');
            updateThemeIcon();
        }
        function toggleAdminTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('admin_theme', isDark ? 'dark' : 'light');
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const isDark = document.documentElement.classList.contains('dark');
            document.getElementById('theme-icon').className = isDark ? 'fa-solid fa-sun text-amber-400' : 'fa-solid fa-moon';
        }
        initTheme();

        const supabaseUrl = 'https://jeinonooelndbtjalnwa.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImplaW5vbm9vZWxuZGJ0amFsbndhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2MjUwNDMsImV4cCI6MjA5MjIwMTA0M30.3g4TS3XSnnZujgXmyxSIy3d9SbiX7BSUOreq3LPH6gI';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let adminState = { items: [], profiles: [], reports: [], proRequests: [], currentTab: 'items', isLoading: true };

        let searchTimer;
        window.handleAdminSearch = () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(renderList, 300);
        };

        async function initAdminPanel() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return showError("Доступ запрещен. Вы не вошли в аккаунт!");

            const { data: profile } = await supabaseClient.from('profiles').select('is_admin').eq('id', user.id).single();
            if (!profile || profile.is_admin !== true) return showError("У вас нет прав модератора!");

            await loadData();
        }

        function showError(msg) {
            document.getElementById('admin-list').innerHTML = `<div class="bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 p-8 rounded-2xl font-bold text-center border border-red-200 dark:border-red-800/50 mt-10 max-w-lg mx-auto"><i class="fa-solid fa-hand-paper text-5xl mb-4 block opacity-50"></i> ${msg}</div>`;
        }

        async function loadData() {
            try {
                const [itemsRes, profilesRes, reportsRes, proRes] = await Promise.all([
                    supabaseClient.from('items').select('*').order('created_at', { ascending: false }),
                    supabaseClient.rpc('get_all_users_for_admin'),
                    supabaseClient.from('reports').select('*').order('created_at', { ascending: false }),
                    supabaseClient.from('pro_requests').select('*').order('created_at', { ascending: false })
                ]);

                if (itemsRes.error) throw itemsRes.error;
                if (profilesRes.error) throw profilesRes.error;

                adminState.items = itemsRes.data || [];
                adminState.profiles = profilesRes.data || [];
                adminState.reports = reportsRes.data || [];
                adminState.proRequests = proRes.data || [];
                adminState.isLoading = false;

                // СЕНЬОР-ФИКС: Счетчик PRO теперь считает ТОЛЬКО новые заявки, а не все подряд
                document.getElementById('count-items').innerText = adminState.items.length;
                document.getElementById('count-users').innerText = adminState.profiles.length;
                document.getElementById('count-reports').innerText = adminState.reports.length;
                document.getElementById('count-pro').innerText = adminState.proRequests.filter(r => r.status === 'pending').length;

                renderList();
            } catch (e) { showError(`Ошибка: ${e.message}`); }
        }

        function switchTab(tab) {
            adminState.currentTab = tab;
            const tabs = ['items', 'users', 'reports', 'pro'];
            const searchInput = document.getElementById('admin-search');
            const catFilter = document.getElementById('admin-category-filter');
            const broadcastBtn = document.getElementById('admin-broadcast-btn');
            
            const activeClass = "flex-1 lg:flex-none px-5 py-2.5 rounded-lg bg-white dark:bg-stone-700 shadow-sm font-bold text-sm text-stone-900 dark:text-white transition flex items-center justify-center gap-2 shrink-0";
            const inactiveClass = "flex-1 lg:flex-none px-5 py-2.5 rounded-lg text-stone-500 dark:text-stone-400 font-bold text-sm hover:text-stone-900 dark:hover:text-white transition flex items-center justify-center gap-2 shrink-0";
            
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if(btn) btn.className = tab === (t === 'pro' ? 'pro_requests' : t) ? activeClass : inactiveClass;
            });

            if (tab === 'items') {
                searchInput.placeholder = "Поиск товаров...";
                catFilter.style.display = "block"; 
                broadcastBtn.style.display = 'none';
            } else if (tab === 'users') {
                searchInput.placeholder = "Поиск по email или имени...";
                catFilter.style.display = "none"; catFilter.value = ""; 
                broadcastBtn.style.display = 'flex'; // Показываем кнопку рассылки
            } else {
                searchInput.placeholder = "Поиск...";
                catFilter.style.display = "none"; catFilter.value = ""; 
                broadcastBtn.style.display = 'none';
            }
            
            searchInput.value = '';
            renderList();
        }

        window.findUser = function(userId) {
            document.getElementById('admin-search').value = userId;
            switchTab('users');
        };

        window.findUserItems = function(userId) {
            document.getElementById('admin-category-filter').value = '';
            document.getElementById('admin-search').value = userId;
            switchTab('items');
        };

        function getTimeLeft(dateStr) {
            if (!dateStr) return '';
            const diff = new Date(dateStr) - new Date();
            if (diff <= 0) return '';
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            if (days > 0) return `<i class="fa-regular fa-clock"></i> ${days}д ${hours}ч`;
            return `<i class="fa-regular fa-clock"></i> ${hours}ч`;
        }

        function renderList() {
            if (adminState.isLoading) return;
            const list = document.getElementById('admin-list');
            const searchTerm = document.getElementById('admin-search').value.toLowerCase().trim();
            const catFilter = document.getElementById('admin-category-filter').value;
            list.innerHTML = '';

            // СЕНЬОР-ФИКС: SVG заглушка для сломанных картинок
            const defaultImage = "data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20800%20600%22%3E%3Cg%20transform%3D%22translate(320%2C%20220)%20scale(0.3)%22%20fill%3D%22%23a8a29e%22%3E%3Cpath%20d%3D%22M512%20144v288c0%2026.5-21.5%2048-48%2048H48c-26.5%200-48-21.5-48-48V144c0-26.5%2021.5-48%2048-48h88l12.3-32.9c7-18.7%2024.9-31.1%2044.9-31.1h125.5c20%200%2037.9%2012.4%2044.9%2031.1L376%2096h88c26.5%200%2048%2021.5%2048%2048zM256%20424c70.7%200%20128-57.3%20128-128s-57.3-128-128-128-128%2057.3-128%20128%2057.3%20128%20128%20128z%22%2F%3E%3C%2Fg%3E%3Ctext%20x%3D%22400%22%20y%3D%22420%22%20font-family%3D%22system-ui%2C%20sans-serif%22%20font-size%3D%2220%22%20font-weight%3D%22800%22%20fill%3D%22%23a8a29e%22%20text-anchor%3D%22middle%22%20letter-spacing%3D%224%22%3E%D0%9D%D0%95%D0%A2%20%D0%A4%D0%9E%D0%A2%D0%9E%3C%2Ftext%3E%3C%2Fsvg%3E";

            if (adminState.currentTab === 'items') {
                const filteredItems = adminState.items.filter(item => {
                    const matchSearch = (item.title || '').toLowerCase().includes(searchTerm) || 
                                        item.id.toLowerCase().includes(searchTerm) ||
                                        (item.user_id || '').toLowerCase().includes(searchTerm);
                    const matchCat = catFilter === "" || (item.category && item.category.startsWith(catFilter));
                    return matchSearch && matchCat;
                });
                
                if (filteredItems.length === 0) return list.innerHTML = '<div class="text-center py-20 text-stone-400 font-bold"><i class="fa-solid fa-box-open text-4xl mb-3 opacity-30 block"></i>Товары не найдены</div>';
                
                filteredItems.forEach(item => {
                    let imgUrl = defaultImage;
                    if (Array.isArray(item.images) && item.images.length > 0 && item.images[0]) { imgUrl = item.images[0]; } 
                    else if (item.image_url) { imgUrl = item.image_url; }

                    const isVIP = item.highlighted_until ? new Date(item.highlighted_until) > new Date() : false;
                    const timeLeftHtml = isVIP ? `<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-[10px] ml-2 animate-pulse">${getTimeLeft(item.highlighted_until)}</span>` : '';
                    
                    const duplicates = adminState.items.filter(i => i.user_id === item.user_id && (i.title || '').toLowerCase() === (item.title || '').toLowerCase());
                    const isDuplicate = duplicates.length > 1;

                    const dupBadge = isDuplicate 
                        ? `<button data-title="${(item.title || '').replace(/"/g, '&quot;')}" onclick="document.getElementById('admin-search').value = this.dataset.title; renderList();" class="bg-red-100 text-red-600 border border-red-200 px-2 py-0.5 rounded text-[10px] font-black uppercase tracking-widest ml-2 shadow-sm cursor-pointer hover:bg-red-200 hover:scale-105 transition" title="Отфильтровать и показать копии">📦 ${duplicates.length} копий</button>` 
                        : '';

                    list.insertAdjacentHTML('beforeend', `
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 bg-stone-50 dark:bg-stone-800 border ${isDuplicate ? 'border-red-300 dark:border-red-800' : 'border-stone-200 dark:border-stone-700'} rounded-xl hover:border-stone-300 transition gap-4 shadow-sm">
                            <div class="flex items-center gap-4 overflow-hidden w-full sm:w-auto">
                                <img src="${imgUrl}" class="w-14 h-14 rounded-lg object-cover shrink-0 border border-stone-200 dark:border-stone-700 bg-stone-200">
                                <div class="overflow-hidden">
                                    <div class="font-black text-stone-800 dark:text-white truncate text-base flex items-center">
                                        ${isVIP ? '<i class="fa-solid fa-crown text-amber-500 mr-1"></i>' : ''}
                                        ${item.title || 'Без названия'} ${timeLeftHtml} ${dupBadge}
                                    </div>
                                    <!-- СЕНЬОР-ФИКС: Добавлен ID товара, который можно легко скопировать -->
                                    <div class="text-[10px] text-stone-400 font-mono mt-0.5 select-all bg-stone-100 dark:bg-stone-900 w-max px-1.5 py-0.5 rounded border border-stone-200 dark:border-stone-700">ID: ${item.id}</div>
                                    <div class="text-xs text-stone-500 font-bold mt-1">
                                        <span class="bg-stone-200 dark:bg-stone-700 px-2 py-0.5 rounded text-[10px] text-stone-600 dark:text-stone-300 mr-1">${item.category || 'Другое'}</span> 
                                        Автор: <span onclick="findUser('${item.user_id}')" class="text-brand-600 hover:text-brand-700 dark:text-brand-400 dark:hover:text-brand-300 hover:underline cursor-pointer" title="Посмотреть профиль пользователя">${item.author_name}</span>
                                    </div>
                                    <div class="text-sm font-bold text-brand-600 dark:text-brand-400 mt-0.5">${item.price} ${item.currency}</div>
                                </div>
                            </div>
                            <div class="flex flex-row gap-2 w-full sm:w-auto shrink-0 mt-2 sm:mt-0">
                                <button onclick="openEditModal('${item.id}')" class="flex-1 sm:flex-none bg-white dark:bg-stone-700 text-stone-600 dark:text-stone-300 border border-stone-200 dark:border-stone-600 hover:border-brand-500 hover:text-brand-600 px-4 py-2.5 rounded-lg font-bold transition flex items-center justify-center gap-2 shadow-sm">
                                    <i class="fa-solid fa-pen"></i> Ред.
                                </button>
                                <button onclick="deleteItem('${item.id}', this)" class="flex-1 sm:flex-none bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-800/50 hover:bg-red-500 hover:text-white px-4 py-2.5 rounded-lg font-bold transition flex items-center justify-center gap-2 shadow-sm">
                                    <i class="fa-solid fa-trash"></i> Удалить
                                </button>
                            </div>
                        </div>
                    `);
                });

            } else if (adminState.currentTab === 'users') {
                const filteredUsers = adminState.profiles.filter(user => 
                    (user.full_name || '').toLowerCase().includes(searchTerm) || 
                    (user.email || '').toLowerCase().includes(searchTerm) || 
                    user.id.toLowerCase().includes(searchTerm)
                );

                if (filteredUsers.length === 0) return list.innerHTML = '<div class="text-center py-20 text-stone-400 font-bold"><i class="fa-solid fa-users text-4xl mb-3 opacity-30 block"></i>Пользователи не найдены</div>';

                filteredUsers.forEach(user => {
                    const avatarUrl = user.avatar_url || defaultImage;
                    const isPro = user.pro_until ? new Date(user.pro_until) > new Date() : false;
                    const itemsCount = adminState.items.filter(i => i.user_id === user.id).length;
                    const regDate = new Date(user.created_at).toLocaleDateString('ru-RU');
                    const phoneDisplay = user.phone ? `<span class="bg-stone-100 dark:bg-stone-700 px-2 py-0.5 rounded-md border border-stone-200 dark:border-stone-600"><i class="fa-solid fa-phone text-stone-400 text-[10px] mr-1"></i>${user.phone}</span>` : '';
                    
                    const isBanned = user.is_banned;
                    const isVerified = user.is_verified || false;
                    const verifiedBadge = isVerified ? `<i class="fa-solid fa-circle-check text-blue-500 ml-1" title="Верифицирован"></i>` : '';
                    const cardClass = isBanned ? "bg-red-50 dark:bg-red-900/10 border-red-200 dark:border-red-900 opacity-75" : "bg-white dark:bg-stone-800 border-stone-200 dark:border-stone-700";
                    const statusBadge = isBanned ? `<span class="bg-red-500 text-white px-2 py-0.5 rounded text-[10px] font-bold uppercase ml-2">ЗАБЛОКИРОВАН</span>` : '';
                    const banInfo = isBanned ? `<div class="text-xs text-red-600 dark:text-red-400 mt-1 font-bold">Причина: ${user.ban_reason || 'Не указана'}</div>` : '';
                    
                    const proTimer = isPro ? `<span class="text-amber-600 text-[10px] ml-1">(${getTimeLeft(user.pro_until)})</span>` : '';

                    list.insertAdjacentHTML('beforeend', `
                        <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center p-4 ${cardClass} border rounded-xl hover:shadow-md transition gap-4">
                            <div class="flex items-center gap-4 overflow-hidden w-full lg:w-auto flex-1">
                                <div class="relative shrink-0">
                                    <img src="${avatarUrl}" class="w-14 h-14 rounded-full object-cover bg-stone-100 border-2 border-stone-200 dark:border-stone-700">
                                </div>
                                <div class="overflow-hidden w-full">
                                    <div class="font-black text-stone-800 dark:text-white truncate text-base flex items-center gap-2 mb-1">
                                        ${user.full_name || 'Без имени'} ${verifiedBadge} 
                                        ${isPro ? `<span class="bg-amber-100 text-amber-600 px-2 py-0.5 rounded text-[10px] uppercase tracking-widest flex items-center gap-1">VIP ${proTimer}</span>` : ''}
                                        ${statusBadge}
                                    </div>
                                    <!-- СЕНЬОР-ФИКС: Добавлен ID юзера -->
                                    <div class="text-[10px] text-stone-400 font-mono mt-0.5 mb-1 select-all bg-stone-100 dark:bg-stone-900 w-max px-1.5 py-0.5 rounded border border-stone-200 dark:border-stone-700">ID: ${user.id}</div>
                                    <div class="flex flex-wrap gap-2 text-xs text-stone-500 font-bold items-center mb-1">
                                        <span><i class="fa-regular fa-envelope mr-1"></i>${user.email || 'Нет email'}</span>
                                        ${phoneDisplay}
                                    </div>

        window.adminMessageToUser = async (userId, btn) => {
            const text = prompt("Введите текст предупреждения/сообщения для пользователя:");
            if (!text) return;
            
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            
            try {
                const { data: { user: adminUser } } = await supabaseClient.auth.getUser();
                
                // Пытаемся найти любой существующий чат между нами
                let { data: chat } = await supabaseClient.from('chats')
                    .select('id')
                    .or(`and(buyer_id.eq.${adminUser.id},seller_id.eq.${userId}),and(buyer_id.eq.${userId},seller_id.eq.${adminUser.id})`)
                    .limit(1)
                    .maybeSingle();
                    
                let chatId;
                if (chat) {
                    chatId = chat.id;
                } else {
                    // Создаем новый чат, привязываясь к первому попавшемуся товару юзера (или любому, если товаров нет)
                    const userItem = adminState.items.find(i => i.user_id === userId);
                    const fallbackItemId = userItem ? userItem.id : (adminState.items[0]?.id || null);
                    
                    const { data: newChat, error } = await supabaseClient.from('chats')
                        .insert([{ buyer_id: adminUser.id, seller_id: userId, item_id: fallbackItemId }])
                        .select().single();
                        
                    if (error) throw error;
                    chatId = newChat.id;
                }
                
                const { error: msgError } = await supabaseClient.from('messages').insert([{
                    chat_id: chatId,
                    sender_id: adminUser.id,
                    text: "⚠️ СООБЩЕНИЕ ОТ МОДЕРАТОРА:\n\n" + text
                }]);
                if (msgError) throw msgError;
                
                alert("Предупреждение успешно отправлено!");
            } catch (e) {
                alert("Ошибка отправки: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        };

        window.adminBroadcastMessage = async () => {
            const text = prompt("Введите текст массовой рассылки для ВСЕХ пользователей:");
            if (!text) return;
            
            const usersCount = adminState.profiles.length;
            if (!confirm(`Вы уверены, что хотите отправить это сообщение ${usersCount} пользователям? Это может занять несколько секунд.`)) return;
            
            const btn = document.getElementById('admin-broadcast-btn');
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Отправка...';
            
            try {
                const { data: { user: adminUser } } = await supabaseClient.auth.getUser();
                let successCount = 0;
                
                // Фильтруем себя, чтобы не слать письмо самому себе
                const targets = adminState.profiles.filter(p => p.id !== adminUser.id);
                
                // Отправляем пачками по 5, чтобы не словить лимиты базы данных (Rate Limits)
                for (let i = 0; i < targets.length; i += 5) {
                    const chunk = targets.slice(i, i + 5);
                    const promises = chunk.map(async (u) => {
                        try {
                            let { data: chat } = await supabaseClient.from('chats')
                                .select('id')
                                .or(`and(buyer_id.eq.${adminUser.id},seller_id.eq.${u.id}),and(buyer_id.eq.${u.id},seller_id.eq.${adminUser.id})`)
                                .limit(1)
                                .maybeSingle();
                                
                            let chatId;
                            if (chat) {
                                chatId = chat.id;
                            } else {
                                const userItem = adminState.items.find(it => it.user_id === u.id);
                                const fallbackItemId = userItem ? userItem.id : (adminState.items[0]?.id || null);
                                const { data: newChat, error } = await supabaseClient.from('chats')
                                    .insert([{ buyer_id: adminUser.id, seller_id: u.id, item_id: fallbackItemId }])
                                    .select().single();
                                if (!error) chatId = newChat.id;
                            }
                            
                            if (chatId) {
                                await supabaseClient.from('messages').insert([{
                                    chat_id: chatId,
                                    sender_id: adminUser.id,
                                    text: "📢 ИНФОРМАЦИЯ ОТ АДМИНИСТРАЦИИ SVALKA:\n\n" + text
                                }]);
                                successCount++;
                            }
                        } catch (err) { console.error("Ошибка при отправке: " + u.id); }
                    });
                    
                    await Promise.all(promises);
                    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ${successCount} / ${targets.length}`;
                }
                
                alert(`Рассылка завершена! Доставлено: ${successCount} пользователям.`);
            } catch (e) {
                alert("Критическая ошибка рассылки: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        };

        async function togglePro(userId, currentStatus, btn) {
            let days = 30;
            const makeVip = !currentStatus;
            
            if (makeVip) {
                const inputDays = prompt("На сколько дней выдать VIP?", "30");
                if (inputDays === null) return;
                days = parseInt(inputDays, 10);
                if (isNaN(days) || days <= 0) return alert("Введите корректное число дней!");
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            try {
                const { error } = await supabaseClient.rpc('admin_set_vip_v2', {
                    target_user_id: userId,
                    make_vip: makeVip,
                    vip_days: days
                });
                
                if (error) throw new Error(error.message);
                
                const newDate = makeVip ? new Date(new Date().setDate(new Date().getDate() + days)).toISOString() : null;
                adminState.items.forEach(i => { if (i.user_id === userId) i.highlighted_until = newDate; });
                const userIndex = adminState.profiles.findIndex(p => p.id === userId);
                if (userIndex > -1) {
                    adminState.profiles[userIndex].pro_until = newDate;
                    adminState.profiles[userIndex].is_pro = makeVip;
                }
                
                renderList();
            } catch (err) {
                alert('Ошибка сервера: ' + err.message);
                renderList();
            }
        }

        async function approveProRequest(reqId, userId, btn) {
            const inputDays = prompt("На сколько дней выдаем VIP за эту заявку?", "30");
            if (inputDays === null) return;
            const days = parseInt(inputDays, 10);
            if (isNaN(days) || days <= 0) return alert("Неверное число дней");

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            try {
                const { error: rpcErr } = await supabaseClient.rpc('admin_set_vip_v2', { 
                    target_user_id: userId, 
                    make_vip: true,
                    vip_days: days
                });
                if (rpcErr) throw new Error("Сервер: " + rpcErr.message);
                
                await supabaseClient.from('pro_requests').update({ status: 'approved' }).eq('id', reqId);
                
                const newDate = new Date(new Date().setDate(new Date().getDate() + days)).toISOString();
                const reqIndex = adminState.proRequests.findIndex(r => r.id === reqId);
                if(reqIndex > -1) adminState.proRequests[reqIndex].status = 'approved';
                
                const userIndex = adminState.profiles.findIndex(p => p.id === userId);
                if(userIndex > -1) {
                    adminState.profiles[userIndex].pro_until = newDate;
                    adminState.profiles[userIndex].is_pro = true;
                }
                adminState.items.forEach(i => { if (i.user_id === userId) i.highlighted_until = newDate; });
                
                renderList();
            } catch (err) {
                alert("Ошибка: " + err.message);
                renderList();
            }
        }

        async function updateTokens(userId, btn) {

            btn.disabled = true;

            const { error } = await supabaseClient.from('profiles').update({ 
                bump_tokens: newBump, 
                vip_tokens: newVip 
            }).eq('id', userId);

            if (error) { 
                alert("Ошибка: " + error.message);
            } else { 
                const index = adminState.profiles.findIndex(p => p.id === userId);
                if(index > -1) {
                    adminState.profiles[index].bump_tokens = newBump;
                    adminState.profiles[index].vip_tokens = newVip;
                }
                
                btn.classList.remove('bg-stone-200', 'dark:bg-stone-700', 'text-stone-700', 'dark:text-stone-300');
                btn.classList.add('bg-green-500', 'text-white');

                    btn.classList.add('bg-stone-200', 'dark:bg-stone-700', 'text-stone-700', 'dark:text-stone-300');

                    btn.disabled = false;
                }, 2000);

        async function deleteItem(itemId, btn) {
            if(!confirm("Удалить это объявление?")) return;
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            
            try {
                const item = adminState.items.find(i => i.id === itemId);
                let filesToDelete = [];
                
                if (item) {
                    let urls = [];
                    if (Array.isArray(item.images)) urls.push(...item.images);
                    if (item.image_url) urls.push(item.image_url);
                    
                    urls.forEach(url => {
                        if (typeof url === 'string' && url.includes('item-images/')) {
                            const match = url.match(/item-images\/(.+?)(?:\?|$)/);
                            if (match && match[1]) filesToDelete.push(decodeURIComponent(match[1]));
                        }
                    });
                }
                
                if (filesToDelete.length > 0) {
                    const { data, error: storageError } = await supabaseClient.storage.from('item-images').remove(filesToDelete);
                }

                const { error } = await supabaseClient.rpc('admin_delete_item', { target_item_id: itemId });
                if (error) throw error;
                
                adminState.items = adminState.items.filter(i => i.id !== itemId);
                btn.closest('.border').style.opacity = '0'; 
                setTimeout(() => renderList(), 300);
                
            } catch (err) {
                alert("Ошибка: " + err.message);
                renderList();
            }
        }

        async function banUser(userId, btn) {
            const reason = prompt("Укажите причину блокировки (пользователь будет выкинут с сайта):");
            if (reason === null) return; 
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            
            const { error } = await supabaseClient.rpc('admin_ban_user', { target_user_id: userId, reason: reason });
            
            if (error) { 
                alert("Ошибка: " + error.message);
                renderList(); 
            } else { 
                const user = adminState.profiles.find(p => p.id === userId);
                if (user) {
                    user.is_banned = true;
                    user.ban_reason = reason;
                }
                renderList();
            }
        }

        async function unbanUser(userId, btn) {
            if(!confirm("Разблокировать пользователя? Его товары снова появятся в ленте.")) return;
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            
            const { error } = await supabaseClient.rpc('admin_unban_user', { target_user_id: userId });
            
            if (error) { 
                alert("Ошибка: " + error.message);
            } else { 
                const user = adminState.profiles.find(p => p.id === userId);
                if (user) {
                    user.is_banned = false;
                    user.ban_reason = null;
                }
                renderList();
            }
        }

        async function deleteUser(userId, btn) {
            if(!confirm("ВНИМАНИЕ! Окончательно удалить пользователя и все его товары? Это действие необратимо!")) return;
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            
            try {
                const userItems = adminState.items.filter(i => i.user_id === userId);
                let itemFilesToDelete = [];
                
                userItems.forEach(item => {
                    let urls = [];
                    if (Array.isArray(item.images)) urls.push(...item.images);
                    if (item.image_url) urls.push(item.image_url);
                    
                    urls.forEach(url => {
                        if (typeof url === 'string' && url.includes('item-images/')) {
                            const match = url.match(/item-images\/(.+?)(?:\?|$)/);
                            if (match && match[1]) itemFilesToDelete.push(decodeURIComponent(match[1]));
                        }
                    });
                });

                const user = adminState.profiles.find(p => p.id === userId);
                let avatarToDelete = null;
                if (user && typeof user.avatar_url === 'string' && user.avatar_url.includes('avatars/')) {
                    const match = user.avatar_url.match(/avatars\/(.+?)(?:\?|$)/);
                    if (match && match[1]) avatarToDelete = decodeURIComponent(match[1]);
                }

                if (itemFilesToDelete.length > 0) {
                    for (let i = 0; i < itemFilesToDelete.length; i += 50) {
                        const chunk = itemFilesToDelete.slice(i, i + 50);
                        await supabaseClient.storage.from('item-images').remove(chunk);
                    }
                }
                
                if (avatarToDelete) {
                    await supabaseClient.storage.from('avatars').remove([avatarToDelete]);
                }

                const { error } = await supabaseClient.rpc('admin_delete_user', { target_user_id: userId });
                if (error) throw error;
                
                adminState.profiles = adminState.profiles.filter(p => p.id !== userId);
                adminState.items = adminState.items.filter(i => i.user_id !== userId);
                btn.closest('.flex-col, .flex, .border').style.opacity = '0'; 
                setTimeout(() => renderList(), 300); 
                
            } catch (err) { 
                alert("Ошибка при удалении: " + err.message); 
                renderList(); 
            }
        }
        
        async function resolveReport(reportId, btn) {
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            const { error } = await supabaseClient.from('reports').update({ status: 'resolved' }).eq('id', reportId);
            if (error) { alert("Ошибка: " + error.message); renderList(); } 
            else { 
                const index = adminState.reports.findIndex(r => r.id === reportId);
                if(index > -1) adminState.reports[index].status = 'resolved'; 
                renderList(); 
            }
        }

        async function deleteReport(reportId, btn) {
            if(!confirm("Окончательно удалить жалобу из базы?")) return;
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            const { error } = await supabaseClient.from('reports').delete().eq('id', reportId);
            if (error) { alert("Ошибка: " + error.message); renderList(); } 
            else { adminState.reports = adminState.reports.filter(r => r.id !== reportId);
            renderList(); }
        }

        window.openEditModal = (itemId) => {
            const item = adminState.items.find(i => i.id === itemId);
            if (!item) return;
            
            document.getElementById('edit-item-id').value = item.id;
            document.getElementById('edit-item-title').value = item.title || '';
            document.getElementById('edit-item-price').value = item.price || 0;
            document.getElementById('edit-item-category').value = item.category || '';
            
            const modal = document.getElementById('admin-edit-modal');
            const content = document.getElementById('admin-edit-modal-content');
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            requestAnimationFrame(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            });
        };

        window.closeEditModal = () => {
            const modal = document.getElementById('admin-edit-modal');
            const content = document.getElementById('admin-edit-modal-content');
            
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        };

        window.saveItemChanges = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('edit-submit-btn');
            const id = document.getElementById('edit-item-id').value;
            const title = document.getElementById('edit-item-title').value.trim();
            const price = parseFloat(document.getElementById('edit-item-price').value);
            const category = document.getElementById('edit-item-category').value.trim();
            
            const originalHtml = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Сохраняем...';
            
            try {
                const { error } = await supabaseClient.from('items').update({ title, price, category }).eq('id', id);
                if (error) throw error;
                
                const item = adminState.items.find(i => i.id === id);
                if (item) { item.title = title; item.price = price; item.category = category; }
                
                closeEditModal();
                renderList();
            } catch (err) { alert('Ошибка: ' + err.message); } 
            finally { btn.disabled = false; btn.innerHTML = originalHtml; }
        };

        window.toggleVerification = async (userId, currentStatus, btn) => {
            btn.disabled = true;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            
            try {
                const newStatus = !currentStatus;
                const { error } = await supabaseClient.from('profiles').update({ is_verified: newStatus }).eq('id', userId);
                if (error) throw error;
                
                const user = adminState.profiles.find(p => p.id === userId);
                if (user) user.is_verified = newStatus;
                
                renderList();
            } catch (e) { alert('Ошибка: ' + e.message); btn.disabled = false; btn.innerHTML = originalHtml; }
        };

        initAdminPanel();
    </script>

    <!-- Модальное окно быстрого редактирования -->
    <div id="admin-edit-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[200] hidden items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-stone-900 w-full max-w-md rounded-[2rem] p-6 sm:p-8 shadow-2xl border border-stone-200 dark:border-stone-800 relative transform scale-95 transition-transform duration-300" id="admin-edit-modal-content">
            <button onclick="closeEditModal()" class="absolute top-5 right-5 text-stone-400 hover:text-red-500 transition text-2xl"><i class="fa-solid fa-xmark"></i></button>
            <h2 class="text-2xl font-black mb-5 text-stone-900 dark:text-white"><i class="fa-solid fa-pen text-brand-500 mr-2"></i> Редактирование</h2>
            
            <form id="edit-item-form" onsubmit="saveItemChanges(event)" class="flex flex-col gap-4">
                <input type="hidden" id="edit-item-id">
                
                <div>
                    <label class="text-xs font-bold text-stone-500 uppercase tracking-widest block mb-1.5 pl-1">Название</label>
                    <input type="text" id="edit-item-title" class="w-full bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-xl px-4 py-3 outline-none focus:border-brand-500 text-stone-900 dark:text-white font-medium transition-colors" required>
                </div>
                
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="text-xs font-bold text-stone-500 uppercase tracking-widest block mb-1.5 pl-1">Цена</label>
                        <input type="number" id="edit-item-price" class="w-full bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-xl px-4 py-3 outline-none focus:border-brand-500 text-stone-900 dark:text-white font-medium transition-colors" required>
                    </div>
                    <div class="flex-1">
                        <label class="text-xs font-bold text-stone-500 uppercase tracking-widest block mb-1.5 pl-1">Категория</label>
                        <input type="text" id="edit-item-category" class="w-full bg-stone-50 dark:bg-stone-800 border border-stone-200 dark:border-stone-700 rounded-xl px-4 py-3 outline-none focus:border-brand-500 text-stone-900 dark:text-white font-medium transition-colors" required>
                    </div>
                </div>
                
                <button type="submit" id="edit-submit-btn" class="bg-brand-500 hover:bg-brand-600 text-white font-bold py-3.5 rounded-xl transition-all shadow-md active:scale-95 mt-4 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-floppy-disk"></i> Сохранить изменения
                </button>
            </form>
        </div>
    </div>

</body>
</html>
